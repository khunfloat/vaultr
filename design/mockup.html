<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Vault — Design</title>
<style>
  /* ===== Tokens (shadcn neutral, dark only) ===== */
  :root {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #141414;
    --card-hover: #1a1a1a;
    --popover: #171717;
    --sidebar: #111111;
    --muted: #262626;
    --muted-foreground: #a1a1aa;
    --subtle-foreground: #71717a;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --input: rgba(255,255,255,.12);
    --ring: #52525b;
    --primary: #fafafa;
    --primary-foreground: #0a0a0a;
    --accent: rgba(255,255,255,.06);

    --blue: #60a5fa;   --blue-bg: rgba(96,165,250,.12);
    --green: #4ade80;  --green-bg: rgba(74,222,128,.12);
    --amber: #fbbf24;  --amber-bg: rgba(251,191,36,.12);
    --red: #f87171;    --red-bg: rgba(248,113,113,.12);
    --violet: #a78bfa; --violet-bg: rgba(167,139,250,.12);

    --radius: 8px;
    --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 14px; height: 14px; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted-foreground); }
  .subtle { color: var(--subtle-foreground); }
  kbd { font: 11px var(--mono); color: var(--muted-foreground); background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; line-height: 18px; }

  /* ===== Primitives ===== */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--input); background: transparent; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--accent); }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; font-weight: 500; }
  .btn.primary:hover { background: #e4e4e7; }
  .btn.ghost { border-color: transparent; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn.sm { height: 28px; padding: 0 8px; font-size: 12px; }
  .btn.icon.sm { width: 28px; padding: 0; }
  .input { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--input); border-radius: 6px; color: var(--muted-foreground); background: rgba(255,255,255,.02); }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
  .badge.blue { color: var(--blue); background: var(--blue-bg); border-color: transparent; }
  .badge.green { color: var(--green); background: var(--green-bg); border-color: transparent; }
  .badge.amber { color: var(--amber); background: var(--amber-bg); border-color: transparent; }
  .badge.red { color: var(--red); background: var(--red-bg); border-color: transparent; }
  .badge.violet { color: var(--violet); background: var(--violet-bg); border-color: transparent; }
  .sep { width: 1px; height: 16px; background: var(--border-strong); }

  /* ===== App shell ===== */
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .vault-switch { display: flex; align-items: center; gap: 10px; margin: 8px; padding: 8px; border-radius: 6px; cursor: pointer; }
  .vault-switch:hover { background: var(--accent); }
  .vault-logo { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
  .vault-switch .name { font-weight: 600; line-height: 1.2; }
  .vault-switch .path { font-size: 11px; color: var(--subtle-foreground); }
  .nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; }
  .nav-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; color: var(--muted-foreground); cursor: pointer; }
  .nav-item:hover { background: var(--accent); color: var(--foreground); }
  .nav-item.active { background: var(--muted); color: var(--foreground); font-weight: 500; }
  .nav-item .end { margin-left: auto; }
  .section-label { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; font-size: 11px; font-weight: 500; color: var(--subtle-foreground); text-transform: uppercase; letter-spacing: .04em; }
  .tree { padding: 0 8px; overflow: auto; flex: 1; min-height: 0; }
  .tree-item { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 8px; border-radius: 6px; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; overflow: hidden; }
  .tree-item:hover { background: var(--accent); color: var(--foreground); }
  .tree-item.active { background: var(--muted); color: var(--foreground); }
  .tree-item .chev { width: 14px; height: 14px; opacity: .6; }
  .sidebar-footer { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); }
  .crumbs b { color: var(--foreground); font-weight: 500; }
  .topbar .spacer { flex: 1; }

  /* ===== Board ===== */
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(280px, 1fr)); gap: 12px; padding: 0 16px 16px; overflow: auto; }
  .col { display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.015); border: 1px solid var(--border); border-radius: 10px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; font-weight: 500; }
  .col-head .count { color: var(--subtle-foreground); font-weight: 400; }
  .col-head .btn { margin-left: auto; }
  .col-body { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 8px; overflow: auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .card.dragging { transform: rotate(2deg); box-shadow: 0 12px 32px rgba(0,0,0,.5); border-color: var(--ring); }
  .card.drop-slot { border: 1px dashed var(--border-strong); background: transparent; height: 64px; }
  .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--subtle-foreground); }
  .card-top .prio { margin-left: auto; }
  .card-title { font-weight: 500; line-height: 1.4; }
  .card.done .card-title { color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: var(--subtle-foreground); }
  .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .card-meta .stat { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--subtle-foreground); }
  .card-meta .stats { margin-left: auto; display: flex; gap: 8px; }
  .progress { height: 3px; background: var(--muted); border-radius: 2px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--muted-foreground); }

  /* ===== Dialog ===== */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 24px; z-index: 10; }
  .dialog { width: min(1080px, 100%); height: min(760px, 100%); background: var(--popover); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden; }
  .dialog-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
  .dialog-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; }
  .dialog-main { overflow: auto; padding: 24px 32px 40px; }
  .dialog-side { border-left: 1px solid var(--border); overflow: auto; padding: 16px; background: rgba(255,255,255,.01); }
  .title-edit { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 16px; padding: 4px 8px; margin-left: -8px; border-radius: 6px; }
  .title-edit:hover { background: var(--accent); }
  .field-label { font-size: 11px; font-weight: 500; color: var(--subtle-foreground); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
  .props { display: grid; grid-template-columns: 88px 1fr; align-items: center; row-gap: 4px; margin-bottom: 20px; }
  .props .k { color: var(--muted-foreground); }
  .props .v { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 8px; margin-left: -8px; border-radius: 6px; cursor: pointer; flex-wrap: wrap; }
  .props .v:hover { background: var(--accent); }
  .side-block { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; margin-bottom: 18px; }
  .link-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; color: var(--muted-foreground); cursor: pointer; }
  .link-row:hover { background: var(--accent); color: var(--foreground); }
  .att { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; }
  .att .thumb { width: 36px; height: 28px; border-radius: 4px; background: repeating-linear-gradient(45deg, #1f2937 0 6px, #111827 6px 12px); }
  .att .meta { font-size: 11px; color: var(--subtle-foreground); }
  .editor-tabs { display: flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: 7px; width: max-content; }
  .editor-tabs span { padding: 3px 10px; border-radius: 5px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; }
  .editor-tabs span.on { background: var(--background); color: var(--foreground); }

  /* ===== Markdown (rendered / live preview) ===== */
  .md { font-size: 14px; line-height: 1.7; color: #e4e4e7; }
  .md h1 { font-size: 26px; line-height: 1.3; margin: 0 0 12px; font-weight: 650; color: var(--foreground); letter-spacing: -.015em; }
  .md h2 { font-size: 17px; margin: 24px 0 8px; font-weight: 600; color: var(--foreground); }
  .md h3 { font-size: 15px; margin: 20px 0 6px; font-weight: 600; color: var(--foreground); }
  .md p { margin: 0 0 10px; }
  .md ul { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li::marker { color: var(--subtle-foreground); }
  .md .task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: flex-start; }
  .md .cb { width: 15px; height: 15px; margin-top: 5px; border: 1.5px solid var(--ring); border-radius: 4px; flex: none; display: grid; place-items: center; }
  .md .cb.on { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
  .md .task.on span { color: var(--subtle-foreground); text-decoration: line-through; }
  .md code { font: 12.5px var(--mono); background: var(--muted); padding: 1px 5px; border-radius: 4px; color: #e4e4e7; }
  .md pre { font: 12.5px/1.6 var(--mono); background: #0f0f0f; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; overflow: auto; position: relative; }
  .md pre .lang { position: absolute; top: 6px; right: 10px; font-size: 11px; color: var(--subtle-foreground); }
  .md pre .k { color: #c084fc; } .md pre .s { color: #86efac; } .md pre .n { color: #fbbf24; } .md pre .c { color: #71717a; } .md pre .e { color: #f87171; }
  .md a.wiki { color: var(--violet); text-decoration: none; border-bottom: 1px solid rgba(167,139,250,.35); cursor: pointer; }
  .md a.wiki:hover { border-bottom-color: var(--violet); }
  .md a.wiki.unresolved { color: var(--muted-foreground); border-bottom-style: dashed; }
  .md .tag { color: var(--blue); background: var(--blue-bg); padding: 1px 6px; border-radius: 999px; font-size: 12.5px; }
  .md mark { background: rgba(251,191,36,.25); color: inherit; padding: 0 2px; border-radius: 2px; }
  .md table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border-strong); padding: 6px 10px; text-align: left; }
  .md th { background: rgba(255,255,255,.03); font-weight: 600; }
  .md blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--border-strong); color: var(--muted-foreground); }
  .md .callout { border-left: 3px solid var(--blue); background: var(--blue-bg); border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 0 0 12px; }
  .md .callout .ct { display: flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 600; margin-bottom: 2px; }
  .md .img { height: 150px; border: 1px solid var(--border); border-radius: 8px; margin: 4px 0 12px; background: linear-gradient(135deg, #18181b, #0f172a); display: grid; place-items: center; color: var(--subtle-foreground); font-size: 12px; }
  /* live-preview: active line shows raw syntax */
  .md .raw { position: relative; background: rgba(255,255,255,.03); margin: 0 -10px 10px; padding: 0 10px; border-radius: 4px; }
  .md .raw .syn { color: var(--subtle-foreground); }
  .caret { display: inline-block; width: 1.5px; height: 1.1em; background: var(--foreground); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .md .ac { position: absolute; left: 190px; top: 26px; width: 260px; background: var(--popover); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.5); padding: 4px; z-index: 2; font-size: 13px; line-height: 1.4; }
  .md .ac div { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; color: var(--muted-foreground); }
  .md .ac div.on { background: var(--muted); color: var(--foreground); }
  .md .ac small { margin-left: auto; color: var(--subtle-foreground); font-size: 11px; }

  /* ===== Notes ===== */
  .tabs { height: 40px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); background: var(--sidebar); }
  .tab { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 12px; border-radius: 6px 6px 0 0; color: var(--muted-foreground); cursor: pointer; max-width: 220px; }
  .tab.on { background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-bottom-color: var(--background); margin-bottom: -1px; }
  .tab .x { opacity: .5; }
  .notes-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 280px; }
  .note-scroll { overflow: auto; }
  .note-head { display: flex; align-items: center; gap: 8px; padding: 8px 16px; color: var(--subtle-foreground); font-size: 12px; }
  .note { max-width: 760px; margin: 0 auto; padding: 16px 40px 80px; }
  .fm { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; margin-bottom: 20px; font-size: 13px; }
  .fm summary { list-style: none; color: var(--subtle-foreground); font-size: 12px; padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .fm .row { display: grid; grid-template-columns: 110px 1fr; align-items: center; min-height: 30px; }
  .fm .row .k { color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
  .rpanel { border-left: 1px solid var(--border); overflow: auto; padding: 12px 16px; }
  .rp-tabs { display: flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: 7px; margin-bottom: 14px; }
  .rp-tabs span { flex: 1; text-align: center; padding: 3px 0; border-radius: 5px; font-size: 12px; color: var(--muted-foreground); }
  .rp-tabs span.on { background: var(--background); color: var(--foreground); }
  .outline a { display: block; padding: 3px 0; color: var(--muted-foreground); text-decoration: none; font-size: 12.5px; }
  .outline a.l2 { padding-left: 12px; } .outline a.l3 { padding-left: 24px; }
  .outline a.on { color: var(--foreground); }
  .backlink { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .backlink:hover { border-color: var(--border-strong); background: var(--accent); }
  .backlink .t { display: flex; align-items: center; gap: 6px; font-weight: 500; margin-bottom: 2px; }
  .backlink .s { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; }
  .backlink .s b { color: var(--violet); font-weight: 500; }

  /* ===== Command / switcher ===== */
  .overlay.top { place-items: start center; padding-top: 12vh; }
  .cmd { width: min(620px, 100%); background: var(--popover); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.6); overflow: hidden; }
  .cmd-input { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cmd-list { padding: 6px; max-height: 360px; overflow: auto; }
  .cmd-group { font-size: 11px; color: var(--subtle-foreground); padding: 8px 8px 4px; font-weight: 500; }
  .cmd-item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 6px; color: var(--muted-foreground); }
  .cmd-item.on { background: var(--muted); color: var(--foreground); }
  .cmd-item em { font-style: normal; color: var(--foreground); font-weight: 600; text-decoration: underline; text-decoration-color: var(--subtle-foreground); text-underline-offset: 3px; }
  .cmd-item .path { margin-left: auto; font-size: 12px; color: var(--subtle-foreground); }
  .cmd-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--subtle-foreground); }
  .cmd-foot span { display: flex; align-items: center; gap: 6px; }

  /* ===== Vault screen ===== */
  .center { height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.05), transparent 60%), var(--background); }
  .vault-card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  .vault-card h2 { margin: 16px 0 4px; font-size: 18px; font-weight: 600; }
  .vault-card p { margin: 0 0 20px; color: var(--muted-foreground); }
  .recent { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .notice { display: flex; gap: 8px; margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); font-size: 12px; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--amber-bg); color: var(--amber); border-bottom: 1px solid rgba(251,191,36,.2); font-size: 12.5px; }
  .banner .btn { margin-left: auto; color: var(--foreground); border-color: rgba(251,191,36,.35); }

  /* ===== Tokens screen ===== */
  .tokens { padding: 32px 40px; overflow: auto; height: 100vh; }
  .tokens h2 { font-size: 16px; margin: 28px 0 12px; }
  .sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sw div { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 12px; }
  .sw i { display: block; height: 48px; }
  .sw span { display: block; padding: 6px 8px; } .sw small { display: block; padding: 0 8px 6px; color: var(--subtle-foreground); font-family: var(--mono); }
  .row-flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  /* ===== Mockup nav (not part of design) ===== */
  .mock-nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 2px; padding: 4px; background: #27272a; border: 1px solid #3f3f46; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .mock-nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; color: #a1a1aa; }
  .mock-nav button.on { background: #fafafa; color: #0a0a0a; }
</style>
</head>
<body>
<div id="root"></div>
<nav class="mock-nav" id="mocknav"></nav>
<script>
const P = {

  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

function card(c) {
  const meta = [];
  if (c.due) meta.push(`<span class="badge ${c.due[0]}">${ic('cal', 'sm', 'width:12px;height:12px')} ${c.due[1]}</span>`);
  (c.labels || []).forEach(([col, l]) => meta.push(`<span class="badge ${col}">${l}</span>`));
  const stats = [];
  if (c.cl) stats.push(`<span class="stat">${ic('checklist', 'sm', 'width:12px;height:12px')} ${c.cl[0]}/${c.cl[1]}</span>`);
  if (c.link) stats.push(`<span class="stat">${ic('link', 'sm', 'width:12px;height:12px')} ${c.link}</span>`);
  if (c.att) stats.push(`<span class="stat">${ic('clip', 'sm', 'width:12px;height:12px')} ${c.att}</span>`);
  return `
  <div class="card ${c.done ? 'done' : ''} ${c.cls || ''}">
    <div class="card-top"><span class="mono">${c.k}</span><span class="prio" title="${c.p}">${prio[c.p]}</span></div>
    <div class="card-title">${c.t}</div>
    ${(meta.length || stats.length) ? `<div class="card-meta">${meta.join('')}<span class="stats">${stats.join('')}</span></div>` : ''}
    ${c.cl && !c.done ? `<div class="progress"><i style="width:${(c.cl[0] / c.cl[1]) * 100}%"></i></div>` : ''}
  </div>`;
}

/* ---------- mockup nav ---------- */
const names = Object.keys(screens);
let current = decodeURIComponent(location.hash.slice(1)) || 'Board';
if (!screens[current]) current = 'Board';
function render() {
  document.getElementById('root').innerHTML = screens[current]();
  document.getElementById('mocknav').innerHTML = names.map((n) => `<button class="${n === current ? 'on' : ''}" data-n="${n}">${n}</button>`).join('');
  try { history.replaceState(null, '', '#' + encodeURIComponent(current)); } catch {}
}
document.getElementById('mocknav').addEventListener('click', (e) => {
  const n = e.target.closest('button')?.dataset.n; if (n) { current = n; render(); }
});
render();
</script>
